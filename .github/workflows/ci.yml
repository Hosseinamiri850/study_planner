name: CI

on:
  push:
    branches: [trunk, master, production-hardening]
  pull_request:
    branches: [trunk, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Test (pytest + coverage gate)
        run: pytest -q --cov=app --cov-report=term
        env:
          SECRET_KEY: ci-test-secret-not-real-do-not-use

  test-postgresql:
    # The suite runs on in-memory SQLite by default; this job exercises the
    # same tests against real PostgreSQL so migration/tz/SQL-dialect behavior
    # is caught before merge. pytest-timeout (thread method) dumps stacks if a
    # test blocks — the first run of this job hung silently for 6h.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: study_planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Test against PostgreSQL
        run: pytest --timeout=60 --timeout-method=thread -v
        env:
          SECRET_KEY: ci-test-secret-not-real-do-not-use
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/study_planner_test
          PYTHONUNBUFFERED: "1"
