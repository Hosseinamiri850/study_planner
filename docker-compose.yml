services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: study_planner
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SECRET_KEY: dev-only-change-me
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/study_planner
      RATELIMIT_STORAGE_URI: redis://redis:6379/1
      FLASK_DEBUG: "false"
    ports:
      - "5000:5000"

volumes:
  pgdata:
