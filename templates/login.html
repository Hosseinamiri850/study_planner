<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('auth.login_title') }} - {{ t('app_name') }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; position: relative; overflow: hidden; }
        body::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(102,126,234,0.1) 1px, transparent 1px); background-size: 50px 50px; animation: moveBackground 20s linear infinite; }
        @keyframes moveBackground { 0% { transform: translate(0,0); } 100% { transform: translate(50px,50px); } }
        .login-container { position: relative; z-index: 1; width: 100%; max-width: 450px; padding: 20px; }
        .login-card { background: rgba(30,41,59,0.95); border-radius: 30px; padding: 50px 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); backdrop-filter: blur(10px); animation: slideUp 0.6s ease-out; border: 1px solid rgba(102,126,234,0.2); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .login-header { text-align: center; margin-bottom: 40px; }
        .login-icon { width: 80px; height: 80px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .login-icon i { font-size: 40px; color: white; }
        h2 { color: #f1f5f9; font-weight: 700; margin-bottom: 10px; }
        .subtitle { color: #94a3b8; font-size: 14px; }
        .form-group { margin-bottom: 25px; position: relative; }
        .form-group label { display: block; color: #cbd5e1; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        .form-group input { width: 100%; padding: 15px; border: 2px solid rgba(148,163,184,0.3); border-radius: 15px; font-size: 15px; transition: all 0.3s ease; background: rgba(15,23,42,0.5); color: #f1f5f9; }
        .form-group input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 4px rgba(102,126,234,0.2); background: rgba(15,23,42,0.7); }
        .form-group input::placeholder { color: #64748b; }
        .btn-login { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 15px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(102,126,234,0.4); }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102,126,234,0.5); }
        .divider { text-align: center; margin: 30px 0; position: relative; }
        .divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: rgba(148,163,184,0.3); }
        .divider span { background: rgba(30,41,59,0.95); padding: 0 15px; color: #94a3b8; font-size: 14px; position: relative; }
        .register-link { text-align: center; color: #94a3b8; font-size: 14px; }
        .register-link a { color: #667eea; text-decoration: none; font-weight: 600; }
        .alert { border-radius: 15px; padding: 12px 20px; margin-bottom: 20px; border: none; }
        .alert-error   { background: rgba(239,68,68,0.2);  color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
        .alert-success { background: rgba(16,185,129,0.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
        .lang-switcher { position: absolute; top: 20px; right: 20px; z-index: 10; }
        .lang-switcher a { color: #94a3b8; text-decoration: none; font-size: 13px; padding: 5px 10px; border: 1px solid rgba(148,163,184,0.3); border-radius: 8px; margin: 0 3px; }
        .lang-switcher a.active { color: #667eea; border-color: #667eea; }
    </style>
</head>
<body>
    <div class="lang-switcher">
        <a href="{{ url_for('web.set_lang', lang='fa') }}" class="{{ 'active' if lang == 'fa' }}">فا</a>
        <a href="{{ url_for('web.set_lang', lang='en') }}" class="{{ 'active' if lang == 'en' }}">EN</a>
    </div>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon"><i class="bi bi-person-circle"></i></div>
                <h2>{{ t('app_name') }}</h2>
                <p class="subtitle">{{ t('auth.login_title') }}</p>
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}{% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}{% endif %}
            {% endwith %}
            <form method="POST">
                <div class="form-group">
                    <label>{{ t('auth.username') }}</label>
                    <input type="text" name="username" required autofocus>
                </div>
                <div class="form-group">
                    <label>{{ t('auth.password') }}</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn-login">{{ t('auth.login_btn') }}</button>
            </form>
            <div class="divider"><span>—</span></div>
            <div class="register-link">
                {{ t('auth.no_account') }}
                <a href="{{ url_for('web.register') }}">{{ t('auth.register_link') }}</a>
            </div>
        </div>
    </div>
<script>
document.querySelectorAll('form[method="POST"]').forEach((form) => {
    form.insertAdjacentHTML('afterbegin', '<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">');
});
</script>
</body>
</html>
