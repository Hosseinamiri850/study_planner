<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('auth.register_title') }} - {{ t('app_name') }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .register-container { position: relative; z-index: 1; width: 100%; max-width: 450px; padding: 20px; }
        .register-card { background: rgba(30,41,59,0.95); border-radius: 30px; padding: 50px 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 1px solid rgba(102,126,234,0.2); }
        .register-header { text-align: center; margin-bottom: 35px; }
        .register-icon { width: 80px; height: 80px; background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        .register-icon i { font-size: 40px; color: white; }
        h2 { color: #f1f5f9; font-weight: 700; margin-bottom: 10px; }
        .subtitle { color: #94a3b8; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #cbd5e1; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        .form-group input { width: 100%; padding: 14px; border: 2px solid rgba(148,163,184,0.3); border-radius: 12px; font-size: 15px; background: rgba(15,23,42,0.5); color: #f1f5f9; transition: all 0.3s; }
        .form-group input:focus { outline: none; border-color: #10b981; box-shadow: 0 0 0 4px rgba(16,185,129,0.2); }
        .btn-register { width: 100%; padding: 15px; background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%); color: white; border: none; border-radius: 15px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-register:hover { transform: translateY(-2px); }
        .login-link { text-align: center; color: #94a3b8; font-size: 14px; margin-top: 25px; }
        .login-link a { color: #10b981; text-decoration: none; font-weight: 600; }
        .alert { border-radius: 12px; padding: 12px 20px; margin-bottom: 20px; border: none; }
        .alert-error   { background: rgba(239,68,68,0.2);  color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
        .alert-success { background: rgba(16,185,129,0.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
        .lang-switcher { position: absolute; top: 20px; right: 20px; z-index: 10; }
        .lang-switcher a { color: #94a3b8; text-decoration: none; font-size: 13px; padding: 5px 10px; border: 1px solid rgba(148,163,184,0.3); border-radius: 8px; margin: 0 3px; }
        .lang-switcher a.active { color: #10b981; border-color: #10b981; }
    </style>
</head>
<body>
    <div class="lang-switcher">
        <a href="{{ url_for('web.set_lang', lang='fa') }}" class="{{ 'active' if lang == 'fa' }}">فا</a>
        <a href="{{ url_for('web.set_lang', lang='en') }}" class="{{ 'active' if lang == 'en' }}">EN</a>
    </div>
    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <div class="register-icon"><i class="bi bi-person-plus"></i></div>
                <h2>{{ t('app_name') }}</h2>
                <p class="subtitle">{{ t('auth.register_title') }}</p>
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}{% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}{% endif %}
            {% endwith %}
            <form method="POST">
                <div class="form-group">
                    <label>{{ t('auth.fullname') }}</label>
                    <input type="text" name="fullname" required autofocus>
                </div>
                <div class="form-group">
                    <label>{{ t('auth.username') }}</label>
                    <input type="text" name="username" required>
                </div>
                <div class="form-group">
                    <label>{{ t('auth.password') }}</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn-register">{{ t('auth.register_btn') }}</button>
            </form>
            <div class="login-link">
                {{ t('auth.have_account') }}
                <a href="{{ url_for('web.login') }}">{{ t('auth.login_link') }}</a>
            </div>
        </div>
    </div>
<script>
document.querySelectorAll('form[method="POST"]').forEach((form) => {
    form.insertAdjacentHTML('afterbegin', '<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">');
});
</script>
</body>
</html>
